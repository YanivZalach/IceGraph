name: CLA automation

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  record:
    name: Record permanent acceptance
    # Run only when a PR comment exactly matches the CLA acceptance statement.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == 'I have read and agree to the IceGraph Individual Contributor License Agreement, Harmony HA-CLA-I-ANY version 1.0, and I confirm that I have authority to submit my contribution.'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record CLA acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/record_cla.py

  verify:
    name: Update CLA status
    needs: record
    if: always() && needs.record.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Checks out the base branch, never the pull request head, so no untrusted
      # code runs with the write-enabled issue_comment token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify CLA acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/check_cla.py
