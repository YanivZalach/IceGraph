name: CLA automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  record:
    name: Record permanent acceptance
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && (github.event.action == 'created' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record CLA acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/record_cla.py

  verify:
    name: Update CLA status
    needs: record
    if: always() && (github.event_name == 'pull_request_target' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Checks out the base branch, never the pull request head, so no untrusted
      # code runs with the elevated pull_request_target token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CLA acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/check_cla.py
